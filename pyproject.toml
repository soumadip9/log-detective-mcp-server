[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log-detective-mcp"
version = "1.0.0"
description = "A hosted MCP server for AI clients to investigate application logs"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Log Detective Team" }
]
dependencies = [
    "mcp>=2.3.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
